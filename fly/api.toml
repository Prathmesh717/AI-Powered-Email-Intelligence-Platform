app = "Smartai-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "api"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  PORT = "8000"
  API_PORT = "8000"
  API_HOST = "0.0.0.0"
  MCP_SERVER_HOST = "Smartai-mcp.internal"
  MCP_SERVER_PORT = "8001"
  OPENAI_MODEL = "gpt-4o-mini"
  OPENAI_MODEL_STRONG = "gpt-4o"
  LANGCHAIN_PROJECT = "Smartai-prod"

[processes]
  app = "uvicorn Smartai.api.main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
  processes = ["app"]
