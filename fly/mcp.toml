app = "Smartai-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "mcp"

[env]
  MCP_SERVER_HOST = "0.0.0.0"
  MCP_SERVER_PORT = "8001"

[processes]
  app = "python -m Smartai.mcp.server.main http"

# Internal-only service — exposed on the 6PN network as Smartai-mcp.internal:8001.
# No public HTTPS, no force_https, no public anycast IP needed.
[[services]]
  protocol = "tcp"
  internal_port = 8001
  processes = ["app"]

  [[services.ports]]
    port = 8001

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["app"]
