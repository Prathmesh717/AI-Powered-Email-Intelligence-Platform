apiVersion: v1
kind: ConfigMap
metadata:
  name: Smartai-config
  namespace: Smartai
  labels:
    app.kubernetes.io/name: Smartai
    app.kubernetes.io/part-of: Smartai
# Non-secret runtime config. Secret values live in 11-secret.yaml.
data:
  # --- LLM provider ---
  LLM_PROVIDER: "openai"
  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_MODEL_STRONG: "gpt-4o"

  # --- Database (host is the in-cluster StatefulSet) ---
  POSTGRES_URL: "postgresql+asyncpg://Smartai:CHANGE_ME@Smartai-postgres:5432/Smartai"
  POSTGRES_SYNC_URL: "postgresql+psycopg://Smartai:CHANGE_ME@Smartai-postgres:5432/Smartai"

  # --- MCP server ---
  MCP_SERVER_HOST: "0.0.0.0"
  MCP_SERVER_PORT: "8001"

  # --- API ---
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # --- Cost + resilience defaults ---
  BUDGET_LIMIT_USD: "5.0"
  MAX_RETRIES: "3"
  CIRCUIT_BREAKER_THRESHOLD: "5"

  # --- LangSmith (optional — leave blank to disable) ---
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "Smartai"

  # --- Approval escalation ---
  APPROVAL_ESCALATION_INTERVAL_SECONDS: "300"
  APPROVAL_FIRST_ESCALATION_MINUTES: "30"
  APPROVAL_SECOND_ESCALATION_MINUTES: "120"
  APPROVAL_AUTO_REJECT_MINUTES: "1440"

  # --- A2A ---
  A2A_DISPATCH_ENABLED: "true"

  # --- Observability ---
  OTEL_ENABLED: "false"
  TRACING_PROVIDER: "langsmith"

  # --- Dashboard ---
  API_URL: "http://Smartai-api:8000"
  API_PUBLIC_URL: "http://Smartai-api:8000"
