apiVersion: apps/v1
kind: Deployment
metadata:
  name: Smartai-mcp
  namespace: Smartai
  labels:
    app.kubernetes.io/name: Smartai
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: Smartai
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: Smartai
        app.kubernetes.io/component: mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/prathmesh/Smartai/mcp:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "Smartai.mcp.server.main", "http"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: Smartai-config
            - secretRef:
                name: Smartai-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # FastMCP writes temp files; tighten with emptyDir later
            capabilities:
              drop: ["ALL"]
